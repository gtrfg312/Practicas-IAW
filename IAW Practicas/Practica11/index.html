<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Práctica de Video y Audio</title>

    <!-- Enlace al archivo CSS externo -->
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- Título principal -->
    <h1>Multimedia en HTML</h1>

    <!-- Sección para el video -->
    <section class="bloque">
        <h2>Video de ejemplo</h2>

        <!-- Video con controles -->
        <video src="videos/ejemplo.mp4" controls width="400"></video>
    </section>

    <!-- Sección para el audio -->
    <section class="bloque">
        <h2>Audio de ejemplo</h2>

        <!-- Audio con controles -->
        <audio src="audios/ejemplo.mp3" controls></audio>
    </section>

</body>

</html>
