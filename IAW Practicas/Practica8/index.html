<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Diseño con Columnas</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <h1>Diseño con Columnas</h1>

    <div class="contenedor">

        <div class="columna">
            <h2>Columna 1</h2>
            <p>Contenido de la primera columna. Ideal para introducción o menú lateral.</p>
        </div>

        <div class="columna">
            <h2>Columna 2</h2>
            <p>Contenido de la segunda columna. Puede incluir texto, imágenes o enlaces.</p>
        </div>

        <div class="columna">
            <h2>Columna 3</h2>
            <p>Contenido de la tercera columna. Útil para anuncios, contacto o redes sociales.</p>
        </div>

    </div>

</body>
</html>
