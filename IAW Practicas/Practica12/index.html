<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Tabla de Horarios</title>

    <!-- Enlace al archivo CSS -->
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <main>
        <!-- Título principal -->
        <h1>Mi horario semanal</h1>

        <!-- Tabla de horarios -->
        <table>

            <!-- Encabezado de la tabla -->
            <thead>
                <tr>
                    <th>Día</th>
                    <th>Actividad</th>
                    <th>Hora</th>
                </tr>
            </thead>

            <!-- Contenido de la tabla -->
            <tbody>

                <tr>
                    <td>Lunes</td>
                    <td>Revisión de proyectos</td>
                    <td>10:00 - 12:00</td>
                </tr>

                <tr>
                    <td>Martes</td>
                    <td>Diseño de materiales</td>
                    <td>14:00 - 16:00</td>
                </tr>

                <tr>
                    <td>Miércoles</td>
                    <td>Mentoría académica</td>
                    <td>09:00 - 11:00</td>
                </tr>

                <tr>
                    <td>Jueves</td>
                    <td>Soporte técnico</td>
                    <td>13:00 - 15:00</td>
                </tr>

                <tr>
                    <td>Viernes</td>
                    <td>Evaluación de procesos</td>
                    <td>11:00 - 13:00</td>
                </tr>

            </tbody>

        </table>
    </main>

</body>

</html>
